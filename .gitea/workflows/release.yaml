name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@e282901cae32c9c45568095f851a7e56d0cbf46d # v1.78.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          niks3_url: https://niks3.trev.zip
          token: ${{ secrets.DOCTOR_TOKEN }}
          fetch_depth: 0
          shell: release

      - name: Release to Gitea
        run: flake-release
        env:
          GIT_TOKEN: ${{ secrets.DOCTOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          CONTAINER_REGISTRY_PASSWORD: ${{ secrets.PACKAGE_TOKEN }}
          DELETE_OLD_RELEASE_ARTIFACTS: 2
          PACKAGES: |
            packages.x86_64-linux.default
            appimages.x86_64-linux.default
            images.x86_64-linux.default
