# https://github.com/actions/labeler

actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .forgejo/workflows/**

kotlin:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.{kt,kts}"
          - "**/gradle.lockfile"
          - "**/gradle.properties"

nix:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.nix"
          - "**/flake.lock"
