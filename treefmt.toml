#:schema https://www.schemastore.org/treefmt.json

[formatter.ktlint]
command = "ktlint"
options = ["--format"]
includes = ["*.kt", "*.kts"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--write"]
includes = ["*.json", "*.yaml", "*.toml", "*.md"]
